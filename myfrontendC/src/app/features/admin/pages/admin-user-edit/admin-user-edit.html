<div class="d-flex flex-column align-items-center min-vh-100 py-5" style="background-color: #f8f9fa;">
  <div class="card shadow-sm rounded-4" style="width: 100%; max-width: 420px;">
    <div class="card-body p-4 p-md-5">

      <h3>Editar usuario</h3>

      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

        <div class="mb-4">
          <label for="name" class="form-label text-muted">Nombre</label>
          <input id="name" type="text" formControlName="name"
                 class="form-control form-control-lg"
                 [class.is-invalid]="userForm.get('name')?.invalid && userForm.get('name')?.touched">
          <div class="invalid-feedback">El nombre es obligatorio.</div>
        </div>

        <div class="mb-4">
          <div class="form-check">
            <input id="admin" type="checkbox" formControlName="admin" class="form-check-input">
            <label for="admin" class="form-check-label text-muted fw-bold">Es Administrador (opcional)</label>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between">
          <a routerLink="/admin/users" class="btn btn-outline-secondary fw-bold px-4 py-2">
            Volver
          </a>
          <button type="submit" class="btn btn-dark text-uppercase px-4 py-2" [disabled]="loading()">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            }
            Editar
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
