
<p>login works!</p>
<form (ngSubmit)="login()">
  <input [(ngModel)]="email" name="email"/>
  <input [(ngModel)]="password" type="password" name="password"/>
  <button [disabled]="!email || !password">Login</button>
  @if (errorMessage) {
    <p>{{ errorMessage }}</p>
  }
</form>
<a [routerLink]="['/register']">Regístrate aquí</a>
